name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: ["main"]
  # Lets you re-run a deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# GITHUB_TOKEN permissions needed by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Queued runs are not cancelled, so a push mid-deploy
# still ships rather than being dropped.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Next.js static export
        env:
          # This repo publishes as a *project* site, so the whole app is served
          # from https://<user>.github.io/<repo>/ rather than the domain root.
          # `configure-pages` reports that prefix, and next.config.ts turns it
          # into `basePath` — without it every /_next/* asset 404s. Reading it
          # from the step output rather than hardcoding "/frontend" keeps the
          # build correct if the repo is renamed or moved to a custom domain
          # (where base_path is empty).
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # `output: "export"` inlines everything at build time, so any value the
          # pages need has to be present here — not at request time.
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          PUBLIC_API_BASE_URL: ${{ secrets.PUBLIC_API_BASE_URL }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Disable Jekyll processing
        # Next writes its assets to `_next/`, and anything with a leading
        # underscore is invisible to Jekyll. The Pages artifact path does not
        # run Jekyll today, but this file costs nothing and removes the failure
        # mode entirely.
        run: touch ./out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    # Split from `build` so the deployment URL is attributed to this
    # environment and shows up on the repo's Environments tab.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
